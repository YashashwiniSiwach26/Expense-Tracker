{% extends "base.html" %}
{% block body %}
<div class="toolbar">
  <label class="inline">Month <input type="month" id="monthPicker"></label>
</div>
<section class="cards">
  <div class="card stat"><span>Total Income</span><b id="cIncome" class="green">–</b></div>
  <div class="card stat"><span>Total Expenses</span><b id="cExpense" class="red">–</b></div>
  <div class="card stat"><span>Remaining Balance</span><b id="cBalance">–</b></div>
  <div class="card stat"><span>Spent This Month</span><b id="cMonth">–</b></div>
</section>
<div id="alerts"></div>
<section class="grid2">
  <div class="card"><h3>Spending by category</h3><div class="chart-box"><canvas id="catChart"></canvas></div></div>
  <div class="card"><h3>Monthly income vs expenses</h3><div class="chart-box"><canvas id="trendChart"></canvas></div></div>
</section>
<section class="card">
  <h3>Recent transactions</h3>
  <div class="table-wrap"><table>
    <thead><tr><th>Date</th><th>Type</th><th>Category</th><th>Description</th><th class="num">Amount</th></tr></thead>
    <tbody id="recentBody"></tbody>
  </table></div>
</section>
{% endblock %}
